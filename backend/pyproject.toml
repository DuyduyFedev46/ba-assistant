[project]
name = "ba-assistant-backend"
version = "0.1.0"
description = "Platform hiểu-họp theo nhịp cho BA — API + Engine (headless)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "tenacity>=9.0",
    "mcp>=1.0",
    "GitPython>=3.1",
    "google-api-python-client>=2.140",
    "google-auth>=2.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tool-description viết VERBATIM theo plan §9 — dòng dài là chủ ý
"app/engine/profile_loader.py" = ["E501"]
